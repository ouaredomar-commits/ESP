        } catch { return INITIAL_MARKETS; }
      });

        } catch { return INITIAL_RATES; }

        } catch { return []; }
      });

      useEffect(() => { localStorage.setItem("esp_markets", JSON.stringify(markets)); }, [markets]);
      useEffect(() => { localStorage.setItem("esp_rates", JSON.stringify(rates)); }, [rates]);

      useEffect(() => {
        if (markets.length > 0 && !markets.some(m => m.id === selectedMarketId)) {
          setSelectedMarketId(markets[0].id);

      }, [markets, selectedMarketId]);

        setPaymentFees(currentMarket.defaultPaymentFee);
        setMarketplaceFees(currentMarket.defaultMarketplaceFee);
      }, [currentMarket]);

      // --- CONVERSION MULTIDEVISES ET RECHERCHE DE CHEMIN COHÉRENT ---
      const convertAmount = useCallback((amount, fromCurr, toCurr, regime) => {
        if (amount < 0) return { error: t.err_negative };
        if (amount === 0) return { value: 0, path: "0", snapshot: null };
        if (fromCurr === toCurr) {
          return { value: amount, path: `${fromCurr} (1:1)`, snapshot: { from: fromCurr, to: toCurr, rate: 1, rateType: regime, rateMode: "direct", source: "Identique" } };
        }

        // Taux direct
        const direct = rates.find(r => r.from === fromCurr && r.to === toCurr && r.rateType === regime);
        if (direct && direct.rate > 0) {
          return { value: amount * direct.rate, path: `${fromCurr} → ${toCurr} (${direct.rate})`, snapshot: direct };
        }

        // Taux inverse
        const inverse = rates.find(r => r.from === toCurr && r.to === fromCurr && r.rateType === regime);
        if (inverse && inverse.rate > 0) {
          const invRate = 1 / inverse.rate;
          return {
            value: amount * invRate,
            path: `${fromCurr} → ${toCurr} (1/${inverse.rate})`,
            snapshot: { from: fromCurr, to: toCurr, rate: invRate, rateType: regime, rateMode: inverse.rateMode, source: `Inversé: ${inverse.source}`, date: inverse.date, time: inverse.time }
          };
        }

        // Taux via intermédiaire (même régime strict)
        const pivots = ["EUR", "USD", "USDT"];
        for (const pivot of pivots) {
          if (fromCurr !== pivot && toCurr !== pivot) {
            let r1 = rates.find(r => r.from === fromCurr && r.to === pivot && r.rateType === regime)?.rate;
            if (!r1) {
              const inv1 = rates.find(r => r.from === pivot && r.to === fromCurr && r.rateType === regime)?.rate;
              if (inv1) r1 = 1 / inv1;
            }

            let r2 = rates.find(r => r.from === pivot && r.to === toCurr && r.rateType === regime)?.rate;
            if (!r2) {
              const inv2 = rates.find(r => r.from === toCurr && r.to === pivot && r.rateType === regime)?.rate;
              if (inv2) r2 = 1 / inv2;
            }

            if (r1 && r2 && r1 > 0 && r2 > 0) {
              const crossRate = r1 * r2;
              return {
                value: amount * crossRate,
                path: `${fromCurr} → ${pivot} → ${toCurr} (Taux: ${crossRate.toFixed(4)})`,
                snapshot: { from: fromCurr, to: toCurr, rate: crossRate, rateType: regime, rateMode: "cross", source: `Via ${pivot}`, intermediate: pivot }
              };
            }
          }
        }

        return { error: `${t.err_missing_rate} (${fromCurr} → ${toCurr} [${regime}])` };
      }, [rates, t]);

      // --- MOTEUR FINANCIER AUDITÉ ---
      const financialCore = useMemo(() => {
        if (!currentMarket) return { error: t.err_empty_markets };
        const targetCurr = currentMarket.currency;

        if (refusalRate < 0 || returnRate < 0 || vatRate < 0 || paymentFees < 0 || marketplaceFees < 0) {
          return { error: t.err_negative };
        }
        if (refusalRate >= 100) {
          return { error: t.err_refusal_100 };
        }

        const converted = {};
        const snapshotsUsed = [];

        for (const [key, item] of Object.entries(costs)) {
          const res = convertAmount(item.value, item.currency, targetCurr, rateRegime);
          if (res.error) return { error: res.error };
          converted[key] = res.value;
          if (res.snapshot) snapshotsUsed.push({ item: key, path: res.path, snapshot: res.snapshot });
        }

        // 1. Coûts de base engagés par commande expédiée
        const baseCostShipped = converted.purchase + converted.ads + converted.packaging + converted.other;

        // Taux de livraison
        const deliveryRate = (100 - refusalRate) / 100;
        const adjustedBaseCost = baseCostShipped / deliveryRate;

        // 2. Coût transport par commande expédiée
        const refusalRatio = refusalRate / 100;
        const expectedTransportShipped = (deliveryRate * shipSuccess) + (refusalRatio * shipFailed);
        const adjustedTransportCost = expectedTransportShipped / deliveryRate;

        // 3. Coût retours après livraison
        const returnRatio = returnRate / 100;
        const returnUnitLoss = returnProcessing + returnShipping + returnLoss;
        const expectedReturnCostDelivered = returnRatio * returnUnitLoss;

        // 4. Coût complet réel unitaire par commande livrée
        const C = adjustedBaseCost + adjustedTransportCost + expectedReturnCostDelivered;

        // 5. Frais proportionnels
        const F = (paymentFees + marketplaceFees) / 100;
        const T = vatRate / 100;

        if (F >= 1) return { error: t.err_denom_zero };

        // Seuil de rentabilité (Break-even strict)
        const minNetPrice = C / (1 - F);
        const minPriceTTC = vatMode === "added" ? minNetPrice * (1 + T) : minNetPrice;

        // Fonction générique de décomposition financière
        const computeMetrics = (targetSellingPrice, isAlreadyTTC) => {
          let priceTTC, priceHT;
          if (vatMode === "added") {
            if (isAlreadyTTC) {
              priceTTC = targetSellingPrice;
              priceHT = priceTTC / (1 + T);
            } else {
              priceHT = targetSellingPrice;
              priceTTC = priceHT * (1 + T);
            }
          } else if (vatMode === "included") {
            priceTTC = targetSellingPrice;
            priceHT = priceTTC / (1 + T);
          } else {
            priceTTC = targetSellingPrice;
            priceHT = targetSellingPrice;
          }

          const collectedVat = priceTTC - priceHT;
          const fees = priceHT * F;
          const profit = priceHT - C - fees;
          const marginPct = priceHT > 0 ? (profit / priceHT) * 100 : 0;
          const status = profit >= 0 ? (marginPct >= 15 ? "profitable" : "low") : "unprofitable";

          return { priceTTC, priceHT, collectedVat, fees, profit, marginPct, status };
        };

        // --- CALCUL DES 6 STRATÉGIES ---
        const strategies = {};

        // 1. Cost Plus
        if (costPlusMode === "markup") {
          const markup = costPlusValue / 100;
          const ht = (C * (1 + markup)) / (1 - F);
          strategies.cost_plus = computeMetrics(ht, false);
        } else {
          const margin = costPlusValue / 100;
          if (F + margin >= 1) {
            strategies.cost_plus = { error: t.err_denom_zero };
          } else {
            const ht = C / (1 - F - margin);
            strategies.cost_plus = computeMetrics(ht, false);
          }
        }

        // 2. Value-Based
        strategies.value = computeMetrics(perceivedValue, vatMode !== "none");

        // 3. Competitive
        const parsedComp = compInput.split(",").map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
        if (parsedComp.length === 0) {
          strategies.comp = { error: "Veuillez saisir au moins un prix concurrent valide." };
        } else {
          const sorted = [...parsedComp].sort((a, b) => a - b);
          const compMin = sorted[0];
          const compMax = sorted[sorted.length - 1];
          const compAvg = sorted.reduce((a, b) => a + b, 0) / sorted.length;
          const midIdx = Math.floor(sorted.length / 2);
          const compMedian = sorted.length % 2 !== 0 ? sorted[midIdx] : (sorted[midIdx - 1] + sorted[midIdx]) / 2;

          let targetComp = compMedian;
          if (compPos === "budget") targetComp = compMedian * 0.95;
          if (compPos === "premium") targetComp = compMedian * 1.10;

          strategies.comp = {
            ...computeMetrics(targetComp, vatMode !== "none"),
            min: compMin, max: compMax, avg: compAvg, median: compMedian
          };
        }

        // 4. Psychological
        const baseRefHT = strategies.cost_plus && !strategies.cost_plus.error ? strategies.cost_plus.priceHT : minNetPrice;
        let intPart = Math.floor(baseRefHT);
        let psychHT = intPart + (parseFloat(psychEndingVal) || 0);
        if (psychHT < minNetPrice) {
          psychHT = Math.ceil(minNetPrice) + (parseFloat(psychEndingVal) || 0);
        }
        strategies.psych = computeMetrics(psychHT, false);

        // 5. Bundle Pricing
        if (bundleQty < 2 || bundleDiscount >= 100) {
          strategies.bundle = { error: t.err_bundle_invalid };
        } else {
          const singleHT = strategies.cost_plus && !strategies.cost_plus.error ? strategies.cost_plus.priceHT : minNetPrice;
          const fullPackHT = singleHT * bundleQty;
          const discountedPackHT = fullPackHT * (1 - bundleDiscount / 100);
          const packMetrics = computeMetrics(discountedPackHT, false);

          const totalBundleCost = C * bundleQty;
          const bundleFees = packMetrics.priceHT * F;
          const realBundleProfit = packMetrics.priceHT - totalBundleCost - bundleFees;
          const realBundleMargin = packMetrics.priceHT > 0 ? (realBundleProfit / packMetrics.priceHT) * 100 : 0;
          const bundleStatus = realBundleProfit >= 0 ? (realBundleMargin >= 15 ? "profitable" : "low") : "unprofitable";

          strategies.bundle = {
            ...packMetrics,
            profit: realBundleProfit,
            marginPct: realBundleMargin,
            status: bundleStatus,
            unitEquivalentTTC: packMetrics.priceTTC / bundleQty,
            totalBundleCost,
            customerSavings: fullPackHT - discountedPackHT
          };
        }

        // 6. Price Anchoring
        const anchorMetrics = computeMetrics(anchorPromoPrice, vatMode !== "none");
        strategies.anchor = {
          ...anchorMetrics,
          referencePrice: anchorRefPrice,
          promoDiscount: anchorRefPrice - anchorPromoPrice
        };

        return {
          targetCurr,
          converted,
          snapshotsUsed,
          adjustedBaseCost,
          adjustedTransportCost,
          expectedReturnCostDelivered,
          effectiveCost: C,
          minNetPrice,
          minPriceTTC,
          strategies
        };
      }, [
        currentMarket, costs, shipSuccess, shipFailed, refusalRate, returnRate,
        returnProcessing, returnShipping, returnLoss, vatMode, vatRate, paymentFees,
        marketplaceFees, rateRegime, convertAmount, costPlusMode, costPlusValue,
        perceivedValue, compInput, compPos, psychEndingVal, bundleQty, bundleDiscount,
        anchorRefPrice, anchorPromoPrice, t
      ]);

      const activeResult = useMemo(() => {
        if (!financialCore || financialCore.error) return null;
        let k = "cost_plus";
        if (activeStrategy === "value") k = "value";
        if (activeStrategy === "competitive") k = "comp";
        if (activeStrategy === "psychological") k = "psych";
        if (activeStrategy === "bundle") k = "bundle";
        if (activeStrategy === "anchor") k = "anchor";
        return financialCore.strategies[k];
      }, [financialCore, activeStrategy]);

      // Sauvegarde Simulation
      const handleSaveSimulation = () => {
        if (!financialCore || financialCore.error || !activeResult || activeResult.error) return;

        const record = {
          id: Date.now(),
          date: new Date().toLocaleDateString(),
          time: new Date().toLocaleTimeString(),
          product: productName,
          market: currentMarket.name,
          currency: financialCore.targetCurr,
          strategy: activeStrategy,
          minPriceTTC: financialCore.minPriceTTC.toFixed(2),
          recommendedPriceTTC: activeResult.priceTTC.toFixed(2),
          recommendedPriceHT: activeResult.priceHT.toFixed(2),
          collectedVat: activeResult.collectedVat.toFixed(2),
          netProfit: activeResult.profit.toFixed(2),
          marginPct: activeResult.marginPct.toFixed(1),
          effectiveCost: financialCore.effectiveCost.toFixed(2),
          rateRegime,
          snapshots: financialCore.snapshotsUsed,
          costsSnapshot: JSON.parse(JSON.stringify(costs))
        };

        setHistory([record, ...history]);
        alert(t.saved_success);
      };

      return (
        <div className={`min-h-screen flex flex-col ${lang === 'ar' ? 'rtl' : 'ltr'}`}>
          {/* Header */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 px-4 py-3 sm:px-6">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-emerald-500 text-slate-950 font-black px-2.5 py-1 rounded text-sm tracking-wider">ESP</div>
                <div className="hidden sm:block">
                  <h1 className="text-sm font-bold tracking-tight">Electronic Selling Price</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Moteur Financier & Multi-Devises International</p>
                </div>
              </div>

              <nav className="flex items-center gap-1 sm:gap-2">
                {[
                  { id: "calculator", label: t.calculator },
                  { id: "compare", label: t.compare_strategies },
                  { id: "markets", label: t.markets },
                  { id: "rates", label: t.rates },
                  { id: "history", label: `${t.history} (${history.length})` },
                  { id: "dashboard", label: t.dashboard }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      activeTab === item.id ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-800'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}

                <select
                  value={lang}
                  onChange={(e) => setLang(e.target.value)}
                  className="bg-slate-800 text-slate-200 text-xs rounded-lg px-2 py-1.5 border border-slate-700 ml-2 font-medium"
                >
                  <option value="fr">🇫🇷 FR</option>
                  <option value="en">🇬🇧 EN</option>
                  <option value="ar">🇩🇿 العربية</option>
                </select>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div className="mb-4 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2 rounded-lg text-xs flex flex-wrap items-center justify-between gap-2">
              <span>⚠️ {t.demo_rate_notice}</span>
              <span className="font-mono text-[11px] font-bold">Régime actif : {rateRegime === 'parallel' ? t.parallel : t.official}</span>
            </div>

            {/* TAB CALCULATEUR */}
            {activeTab === "calculator" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-5">

                  {/* Profil et Régime */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.product_name}</label>
                        <input
                          type="text"
                          value={productName}
                          onChange={(e) => setProductName(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.market_profile}</label>
                        <select
                          value={selectedMarketId}
                          onChange={(e) => setSelectedMarketId(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-semibold text-emerald-800"
                        >
                          {markets.map(m => (
                            <option key={m.id} value={m.id}>{m.flag} {m.name} ({m.currency})</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.rate_regime}</label>
                        <select
                          value={rateRegime}
                          onChange={(e) => setRateRegime(e.target.value)}
                          className="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-xs font-bold"
                        >
                          <option value="parallel">⬛ {t.parallel}</option>
                          <option value="official">🏛️ {t.official}</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* 1. Coûts Directs */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-2">
                      {t.costs_section}
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {[
                        { key: "purchase", label: t.buy_price },
                        { key: "ads", label: t.ads },
                        { key: "packaging", label: t.pack },
                        { key: "other", label: t.other_costs }
                      ].map(item => (
                        <div key={item.key}>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">{item.label}</label>
                          <div className="flex gap-2">
                            <input
                              type="number"
                              min="0"
                              value={costs[item.key].value}
                              onChange={(e) => setCosts({
                                ...costs,
                                [item.key]: { ...costs[item.key], value: Math.max(0, parseFloat(e.target.value) || 0) }
                              })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-mono"
                            />
                            <select
                              value={costs[item.key].currency}
                              onChange={(e) => setCosts({
                                ...costs,
                                [item.key]: { ...costs[item.key], currency: e.target.value }
                              })}
                              className="bg-slate-100 border border-slate-300 rounded-lg px-2 text-xs font-bold"
                            >
                              {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 2. Logistique & Refus */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-2">
                      {t.logistics_section} ({currentMarket?.currency})
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.ship_success}</label>
                        <input
                          type="number"
                          min="0"
                          value={shipSuccess}
                          onChange={(e) => setShipSuccess(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.ship_failed}</label>
                        <input
                          type="number"
                          min="0"
                          value={shipFailed}
                          onChange={(e) => setShipFailed(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-red-600 mb-1">{t.refusal_rate}</label>
                        <input
                          type="number"
                          min="0"
                          max="99.9"
                          value={refusalRate}
                          onChange={(e) => setRefusalRate(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-white border border-red-300 rounded-lg px-3 py-1.5 text-sm font-mono font-bold text-red-700"
                        />
                      </div>
                    </div>

                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-3">
                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                        <div>
                          <label className="block text-[11px] font-bold text-amber-700 mb-1">{t.returns_rate}</label>
                          <input
                            type="number"
                            min="0"
                            max="100"
                            value={returnRate}
                            onChange={(e) => setReturnRate(Math.max(0, parseFloat(e.target.value) || 0))}
                            className="w-full bg-white border border-amber-300 rounded px-2 py-1 text-xs font-mono font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] text-slate-600 mb-1">{t.return_processing}</label>
                          <input
                            type="number"
                            min="0"
                            value={returnProcessing}
                            onChange={(e) => setReturnProcessing(Math.max(0, parseFloat(e.target.value) || 0))}
                            className="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] text-slate-600 mb-1">{t.return_shipping}</label>
                          <input
                            type="number"
                            min="0"
                            value={returnShipping}
                            onChange={(e) => setReturnShipping(Math.max(0, parseFloat(e.target.value) || 0))}
                            className="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] text-slate-600 mb-1">{t.return_loss}</label>
                          <input
                            type="number"
                            min="0"
                            value={returnLoss}
                            onChange={(e) => setReturnLoss(Math.max(0, parseFloat(e.target.value) || 0))}
                            className="w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* 3. Fiscalité & Frais */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-2">
                      {t.tax_section}
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.vat_mode}</label>
                        <select
                          value={vatMode}
                          onChange={(e) => setVatMode(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-medium"
                        >
                          <option value="none">{t.vat_none}</option>
                          <option value="added">{t.vat_added}</option>
                          <option value="included">{t.vat_included}</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.vat_rate}</label>
                        <input
                          type="number"
                          min="0"
                          disabled={vatMode === "none"}
                          value={vatRate}
                          onChange={(e) => setVatRate(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono disabled:opacity-50"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.payment_fees}</label>
                        <input
                          type="number"
                          min="0"
                          value={paymentFees}
                          onChange={(e) => setPaymentFees(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">{t.marketplace_fees}</label>
                        <input
                          type="number"
                          min="0"
                          value={marketplaceFees}
                          onChange={(e) => setMarketplaceFees(Math.max(0, parseFloat(e.target.value) || 0))}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono"
                        />
                      </div>
                    </div>
                  </div>

                  {/* 4. Stratégie */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100 pb-2">
                      {t.strategy_section}
                    </h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Stratégie active</label>
                        <select
                          value={activeStrategy}
                          onChange={(e) => setActiveStrategy(e.target.value)}
                          className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-emerald-800"
                        >
                          <option value="cost_plus">{t.strat_cost_plus}</option>
                          <option value="value">{t.strat_value}</option>
                          <option value="competitive">{t.strat_comp}</option>
                          <option value="psychological">{t.strat_psych}</option>
                          <option value="bundle">{t.strat_bundle}</option>
                          <option value="anchor">{t.strat_anchor}</option>
                        </select>
                      </div>

                      <div>
                        {activeStrategy === "cost_plus" && (
                          <div className="space-y-2">
                            <div className="flex gap-2 text-xs">
                              <label className="flex items-center gap-1 cursor-pointer">
                                <input type="radio" name="cpm" checked={costPlusMode === "markup"} onChange={() => setCostPlusMode("markup")} />
                                <span>{t.mode_markup}</span>
                              </label>
                              <label className="flex items-center gap-1 cursor-pointer ml-3">
                                <input type="radio" name="cpm" checked={costPlusMode === "margin"} onChange={() => setCostPlusMode("margin")} />
                                <span>{t.mode_target_margin}</span>
                              </label>
                            </div>
                            <input
                              type="number"
                              min="0"
                              max="99.9"
                              value={costPlusValue}
                              onChange={(e) => setCostPlusValue(Math.max(0, parseFloat(e.target.value) || 0))}
                              className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono font-bold text-emerald-700"
                            />
                          </div>
                        )}

                        {activeStrategy === "value" && (
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">{t.perceived_val} ({currentMarket?.currency})</label>
                            <input
                              type="number"
                              min="0"
                              value={perceivedValue}
                              onChange={(e) => setPerceivedValue(Math.max(0, parseFloat(e.target.value) || 0))}
                              className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono font-bold"
                            />
                          </div>
                        )}

                        {activeStrategy === "competitive" && (
                          <div className="space-y-2">
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">{t.comp_prices}</label>
                              <input
                                type="text"
                                value={compInput}
                                onChange={(e) => setCompInput(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-mono"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-slate-700 mb-1">{t.comp_position}</label>
                              <select
                                value={compPos}
                                onChange={(e) => setCompPos(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-xs"
                              >
                                <option value="budget">{t.pos_budget}</option>
                                <option value="mid">{t.pos_mid}</option>
                                <option value="premium">{t.pos_premium}</option>
                              </select>
                            </div>
                          </div>
                        )}

                        {activeStrategy === "psychological" && (
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">{t.psych_ending}</label>
                            <select
                              value={psychEndingVal}
                              onChange={(e) => setPsychEndingVal(e.target.value)}
                              className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-mono"
                            >
                              <option value=".00">.00 (Prix Rond)</option>
                              <option value=".90">.90</option>
                              <option value=".95">.95</option>
                              <option value=".99">.99</option>
                              <option value=".50">.50</option>
                            </select>
                          </div>
                        )}

                        {activeStrategy === "bundle" && (
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="block text-[11px] font-semibold text-slate-700 mb-1">{t.bundle_qty}</label>
                              <input
                                type="number"
                                min="2"
                                value={bundleQty}
                                onChange={(e) => setBundleQty(Math.max(2, parseInt(e.target.value) || 2))}
                                className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-semibold text-slate-700 mb-1">{t.bundle_discount}</label>
                              <input
                                type="number"
                                min="0"
                                max="99"
                                value={bundleDiscount}
                                onChange={(e) => setBundleDiscount(Math.max(0, parseFloat(e.target.value) || 0))}
                                className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                              />
                            </div>
                          </div>
                        )}

                        {activeStrategy === "anchor" && (
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="block text-[11px] font-semibold text-slate-700 mb-1">{t.anchor_ref}</label>
                              <input
                                type="number"
                                min="0"
                                value={anchorRefPrice}
                                onChange={(e) => setAnchorRefPrice(Math.max(0, parseFloat(e.target.value) || 0))}
                                className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-mono"
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] font-semibold text-slate-700 mb-1">{t.anchor_promo}</label>
                              <input
                                type="number"
                                min="0"
                                value={anchorPromoPrice}
                                onChange={(e) => setAnchorPromoPrice(Math.max(0, parseFloat(e.target.value) || 0))}
                                className="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs font-mono font-bold text-emerald-700"
                              />
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                </div>

                {/* Synthèse Latérale */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-slate-900 text-white rounded-2xl shadow-xl p-6 sticky top-20 border border-slate-800">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                      <span className="text-xs uppercase tracking-wider text-slate-400 font-bold">Audit Financier ESP</span>
                      {activeResult && !activeResult.error && (
                        <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-black uppercase tracking-wider ${
                          activeResult.status === 'profitable' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' :
                          activeResult.status === 'low' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' :
                          'bg-red-500/20 text-red-400 border border-red-500/40'
                        }`}>
                          {activeResult.status === 'profitable' ? `🟢 ${t.status_profitable}` :
                           activeResult.status === 'low' ? `🟠 ${t.status_low}` : `🔴 ${t.status_unprofitable}`}
                        </span>
                      )}
                    </div>

                    {financialCore?.error ? (
                      <div className="p-4 bg-red-950/80 border border-red-700 rounded-xl text-xs text-red-300 font-medium">
                        ⚠️ {financialCore.error}
                      </div>
                    ) : activeResult?.error ? (
                      <div className="p-4 bg-red-950/80 border border-red-700 rounded-xl text-xs text-red-300 font-medium">
                        ⚠️ {activeResult.error}
                      </div>
                    ) : activeResult ? (
                      <div className="space-y-4">
                        <div>
                          <div className="text-xs text-slate-400 font-medium mb-1">{t.rec_price} (TTC / Affiché)</div>
                          <div className="text-4xl font-black text-emerald-400 font-mono tracking-tight">
                            {activeResult.priceTTC.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                            <span className="text-lg text-emerald-200 ml-1.5 font-sans">{financialCore.targetCurr}</span>
                          </div>
                          {activeStrategy === "bundle" && (
                            <div className="text-xs text-slate-400 mt-1">
                              Soit {activeResult.unitEquivalentTTC.toFixed(2)} {financialCore.targetCurr} / unité
                            </div>
                          )}
                        </div>

                        <div className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-1.5 text-xs font-mono">
                          <div className="flex justify-between text-slate-300">
                            <span>{t.rec_price_ht} :</span>
                            <span className="font-bold">{activeResult.priceHT.toFixed(2)} {financialCore.targetCurr}</span>
                          </div>
                          {vatMode !== "none" && (
                            <div className="flex justify-between text-slate-400">
                              <span>{t.collected_vat} ({vatRate}%) :</span>
                              <span>+{activeResult.collectedVat.toFixed(2)} {financialCore.targetCurr}</span>
                            </div>
                          )}
                          <div className="flex justify-between text-slate-400">
                            <span>{t.total_fees} :</span>
                            <span>-{activeResult.fees.toFixed(2)} {financialCore.targetCurr}</span>
                          </div>
                          <div className="flex justify-between text-slate-400 border-t border-slate-700/60 pt-1.5">
                            <span>{t.effective_cost} :</span>
                            <span>{financialCore.effectiveCost.toFixed(2)} {financialCore.targetCurr}</span>
                          </div>
                          <div className="flex justify-between text-emerald-400 font-bold border-t border-slate-700/60 pt-1.5">
                            <span>{t.min_price_ttc} :</span>
                            <span>{financialCore.minPriceTTC.toFixed(2)} {financialCore.targetCurr}</span>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <span className="text-[11px] text-slate-400 block">{t.net_profit}</span>
                            <span className="text-lg font-bold font-mono text-emerald-300">
                              +{activeResult.profit.toFixed(2)} {financialCore.targetCurr}
                            </span>
                          </div>
                          <div className="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                            <span className="text-[11px] text-slate-400 block">{t.net_margin}</span>
                            <span className="text-lg font-bold font-mono text-blue-300">
                              {activeResult.marginPct.toFixed(1)} %
                            </span>
                          </div>
                        </div>

                        <div className="text-[11px] text-slate-400 border-t border-slate-800 pt-3 space-y-1">
                          <div className="font-semibold text-slate-300 mb-1">Conversions appliquées :</div>
                          {financialCore.snapshotsUsed.length === 0 ? (
                            <div className="text-slate-500">Tous les coûts sont déjà en {financialCore.targetCurr}.</div>
                          ) : (
                            financialCore.snapshotsUsed.map((s, idx) => (
                              <div key={idx} className="flex justify-between font-mono text-slate-300 bg-slate-800/40 px-2 py-1 rounded">
                                <span>{s.item} :</span>
                                <span>{s.path}</span>
                              </div>
                            ))
                          )}
                        </div>

                        <button
                          onClick={handleSaveSimulation}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-slate-950 font-black py-3 rounded-xl transition duration-150 text-sm shadow-lg shadow-emerald-950/50"
                        >
                          💾 {t.save_sim}
                        </button>
                      </div>
                    ) : null}
                  </div>
                </div>
              </div>
            )}

            {/* TAB COMPARATEUR */}
            {activeTab === "compare" && financialCore && !financialCore.error && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                <h2 className="text-lg font-bold text-slate-900">{t.compare_strategies}</h2>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-slate-100 text-slate-700 border-b border-slate-200 font-sans font-bold">
                      <tr>
                        <th className="p-3">{t.table_strategy}</th>
                        <th className="p-3 text-right">{t.table_price_ttc}</th>
                        <th className="p-3 text-right">{t.table_price_ht}</th>
                        <th className="p-3 text-right">{t.table_cost}</th>
                        <th className="p-3 text-right">{t.table_profit}</th>
                        <th className="p-3 text-right">{t.table_margin}</th>
                        <th className="p-3 text-center">{t.table_status}</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {[
                        { key: "cost_plus", name: t.strat_cost_plus },
                        { key: "value", name: t.strat_value },
                        { key: "comp", name: t.strat_comp },
                        { key: "psych", name: t.strat_psych },
                        { key: "bundle", name: t.strat_bundle },
                        { key: "anchor", name: t.strat_anchor }
                      ].map(item => {
                        const res = financialCore.strategies[item.key];
                        if (!res || res.error) {
                          return (
                            <tr key={item.key} className="text-slate-400">
                              <td className="p-3 font-sans font-medium">{item.name}</td>
                              <td colSpan="6" className="p-3 text-center italic">{res ? res.error : "Données manquantes"}</td>
                            </tr>
                          );
                        }
                        return (
                          <tr key={item.key} className="hover:bg-slate-50">
                            <td className="p-3 font-sans font-bold text-slate-800">{item.name}</td>
                            <td className="p-3 text-right font-bold text-emerald-700">{res.priceTTC.toFixed(2)} {financialCore.targetCurr}</td>
                            <td className="p-3 text-right text-slate-600">{res.priceHT.toFixed(2)}</td>
                            <td className="p-3 text-right text-slate-500">{(res.totalBundleCost || financialCore.effectiveCost).toFixed(2)}</td>
                            <td className={`p-3 text-right font-bold ${res.profit >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                              {res.profit >= 0 ? `+${res.profit.toFixed(2)}` : res.profit.toFixed(2)}
                            </td>
                            <td className="p-3 text-right text-blue-600 font-bold">{res.marginPct.toFixed(1)}%</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                res.status === 'profitable' ? 'bg-emerald-100 text-emerald-800' :
                                res.status === 'low' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'
                              }`}>
                                {res.status === 'profitable' ? t.status_profitable : res.status === 'low' ? t.status_low : t.status_unprofitable}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB MARCHÉS (CRUD) */}
            {activeTab === "markets" && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h2 className="text-lg font-bold text-slate-900">{t.markets}</h2>
                  <button
                    onClick={() => {
                      const name = prompt("Nom du marché :");
                      const currency = prompt("Devise (DZD, TND, MAD, EUR, USD, USDT) :", "EUR");
                      if (!name || !currency) return;
                      const newM = {
                        id: `m-${Date.now()}`,
                        name, flag: "🌐", currency,
                        vatMode: "none", vatRate: 0,
                        defaultShip: 5, defaultFailedShip: 5, defaultRefusalRate: 5,
                        defaultReturnRate: 5, defaultReturnProcessing: 2, defaultReturnShipping: 3,
                        defaultReturnLoss: 1, defaultPack: 1, defaultPaymentFee: 1.5, defaultMarketplaceFee: 0
                      };
                      setMarkets([...markets, newM]);
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg"
                  >
                    + {t.add_market}
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {markets.map(m => (
                    <div key={m.id} className="p-4 border border-slate-200 rounded-xl bg-slate-50 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-slate-800 text-sm">{m.flag} {m.name}</span>
                        <div className="flex items-center gap-2">
                          <span className="font-mono text-xs font-bold bg-slate-200 px-2 py-0.5 rounded">{m.currency}</span>
                          <button
                            onClick={() => {
                              if (markets.length <= 1) {
                                alert("Vous devez conserver au moins un profil de marché.");
                                return;
                              }
                              if (confirm(t.confirm_del)) {
                                setMarkets(markets.filter(x => x.id !== m.id));
                              }
                            }}
                            className="text-xs text-red-600 hover:text-red-800 font-bold"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 text-xs text-slate-600 gap-y-1">
                        <div>Livraison : <span className="font-mono">{m.defaultShip} {m.currency}</span></div>
                        <div>TVA : <span className="font-mono">{m.vatRate}%</span></div>
                        <div>Taux Refus : <span className="font-mono">{m.defaultRefusalRate}%</span></div>
                        <div>Taux Retour : <span className="font-mono">{m.defaultReturnRate}%</span></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB TAUX DE CHANGE (CRUD) */}
            {activeTab === "rates" && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
                <div className="flex flex-wrap justify-between items-center border-b border-slate-100 pb-3 gap-2">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900">{t.rates}</h2>
                    <p className="text-xs text-slate-500">{t.official_api_info}</p>
                  </div>
                  <button
                    onClick={() => {
                      const from = prompt("Devise Source (ex: EUR) :", "EUR");
                      const to = prompt("Devise Cible (ex: DZD) :", "DZD");
                      const rate = parseFloat(prompt("Taux (ex: 265) :", "265"));
                      const rateType = prompt("Régime (parallel ou official) :", "parallel");
                      if (!from || !to || isNaN(rate) || rate <= 0) return;
                      const newRate = {
                        id: `r-${Date.now()}`,
                        from, to, rate, rateType, rateMode: "manual",
                        source: "Saisie Manuelle",
                        date: new Date().toISOString().split("T")[0],
                        time: new Date().toLocaleTimeString()
                      };
                      setRates([...rates, newRate]);
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg"
                  >
                    + {t.add_rate}
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-slate-100 text-slate-700 border-b border-slate-200 font-sans font-bold">
                      <tr>
                        <th className="p-3">Paire</th>
                        <th className="p-3">Taux</th>
                        <th className="p-3">Régime</th>
                        <th className="p-3">Mode</th>
                        <th className="p-3">Source</th>
                        <th className="p-3">Date</th>
                        <th className="p-3 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {rates.map(r => (
                        <tr key={r.id} className="hover:bg-slate-50">
                          <td className="p-3 font-bold text-slate-900">{r.from} → {r.to}</td>
                          <td className="p-3 text-emerald-700 font-extrabold">{r.rate}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              r.rateType === 'parallel' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                            }`}>
                              {r.rateType === 'parallel' ? 'Parallèle' : 'Officiel'}
                            </span>
                          </td>
                          <td className="p-3 text-slate-600 uppercase text-[10px]">{r.rateMode}</td>
                          <td className="p-3 text-slate-600">{r.source}</td>
                          <td className="p-3 text-slate-400">{r.date} {r.time}</td>
                          <td className="p-3 text-center">
                            <button
                              onClick={() => {
                                if (confirm(t.confirm_del)) setRates(rates.filter(x => x.id !== r.id));
                              }}
                              className="text-red-600 hover:text-red-800 font-bold"
                            >
                              ✕
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB HISTORIQUE */}
            {activeTab === "history" && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h2 className="text-base font-bold text-slate-900">{t.history}</h2>
                  {history.length > 0 && (
                    <button
                      onClick={() => { if (confirm("Effacer tout l'historique ?")) setHistory([]); }}
                      className="text-xs text-red-600 font-bold"
                    >
                      Vider l'historique
                    </button>
                  )}
                </div>

                {history.length === 0 ? (
                  <div className="py-12 text-center text-slate-400 text-xs">Aucune simulation enregistrée.</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-slate-50 text-slate-600 border-b border-slate-200 font-sans font-bold">
                        <tr>
                          <th className="p-3">Date</th>
                          <th className="p-3">Produit</th>
                          <th className="p-3">Marché</th>
                          <th className="p-3">Stratégie</th>
                          <th className="p-3 text-right">Seuil TTC</th>
                          <th className="p-3 text-right">Prix Conseillé TTC</th>
                          <th className="p-3 text-right">Bénéfice</th>
                          <th className="p-3 text-right">Marge</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {history.map(item => (
                          <tr key={item.id} className="hover:bg-slate-50">
                            <td className="p-3 text-slate-500">{item.date} {item.time}</td>
                            <td className="p-3 font-semibold text-slate-900">{item.product}</td>
                            <td className="p-3 text-slate-600">{item.market}</td>
                            <td className="p-3 uppercase text-[10px] text-slate-500 font-sans font-bold">{item.strategy}</td>
                            <td className="p-3 text-right text-slate-600">{item.minPriceTTC} {item.currency}</td>
                            <td className="p-3 text-right font-bold text-emerald-600">{item.recommendedPriceTTC} {item.currency}</td>
                            <td className="p-3 text-right text-emerald-600 font-bold">+{item.netProfit} {item.currency}</td>
                            <td className="p-3 text-right text-blue-600 font-bold">{item.marginPct}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB DASHBOARD */}
            {activeTab === "dashboard" && (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-bold text-slate-500 uppercase">Simulations Sauvegardées</span>
                  <div className="text-3xl font-black text-slate-900 mt-2 font-mono">{history.length}</div>
                </div>
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-bold text-slate-500 uppercase">Profils Marchés Actifs</span>
                  <div className="text-3xl font-black text-emerald-600 mt-2 font-mono">{markets.length}</div>
                </div>
                <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <span className="text-xs font-bold text-slate-500 uppercase">Taux de Change Enregistrés</span>
                  <div className="text-3xl font-black text-blue-600 mt-2 font-mono">{rates.length}</div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
